<!doctype html>
<html>
<head><meta charset="utf-8"><title>BackendRail</title></head>
<body>
<div id="root" style="height:300px;display:flex"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  add(A.BackendRail, { active: 'home', onadd: function () {}, backends: [
    { id: 'home', label: 'Home lab' }, { id: 'work', label: 'Work', unread: true, mentions: 3 },
    { id: 'family', label: 'Family chat', unread: true }, { id: 'club', label: 'Book club', state: 'offline' }] });
</script>
</body>
</html>
