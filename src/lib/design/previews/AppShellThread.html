<!-- @dsCard group="Layout" height=640 width=1280 page subtitle="Thread open in the main pane" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>App shell, thread open</title><style>html,body{height:100%}</style></head>
<body>
<div id="root" style="height:640px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var alice = { user_id: 'alice', name: 'Alice Chen' }, bob = { user_id: 'bob', name: 'Bob' }, dana = { user_id: 'dana', name: 'Dana' }, me = { user_id: 'sam', name: 'Sam' };
  var noop = function () {}, $ = function (id) { return document.getElementById(id); };
  // The shell: the rooms list and the main pane are markup the parts below are mounted into.
  A.render(A.AppShell, root, {
    rail: A.html('<span id="rail" style="display:contents"></span>'),
    sideToggle: A.part(A.PanelToggle, { side: 'left', panel: 'rooms', open: true }),
    side: A.html('<aside class="ap-shell-side" id="side"><div class="ap-shell-sidehead">Work</div><div class="ap-shell-sidebody" id="sidebody"></div></aside>'),
    sideHandle: A.part(A.PanelHandle, { side: 'left' }),
    main: A.html('<span id="head" style="display:contents"></span><div class="ap-timeline" id="tl"></div><span id="foot" style="display:contents"></span>')
  });
  var acts = function () { return A.part(A.MessageActions, { items: [{ label: 'Reply in thread', glyph: 'Reply' }, { label: 'Edit', glyph: 'Edit' }], onmore: noop }); };
  function side(activeThread) {
    var rooms = [
      { room: 'general', name: 'General' }, { room: 'ops', name: 'Ops', active: !activeThread },
      { thread: 'deploy', name: 'Deploy', active: activeThread === 'deploy', unread: activeThread ? 0 : 2, summary: 'Worker 1.9.0 crash-looped; rolled back to 1.8.3', latest: { sender: 'Sam', text: 'Re-running the migration now.' } },
      { thread: 'mig-0042', name: 'Migration 0042', summary: 'Lock held on accounts table by a stale worker', latest: { sender: 'Dana', text: 'Lock cleared' } }, { thread: 'oncall', name: 'On-call rotation' },
      { room: 'design', name: 'Design', unread: 4, mentions: activeThread ? 0 : 1 }, { room: 'random', name: 'Random' }];
    add(A.SidebarSection, { title: 'Rooms', children: A.parts.apply(null, rooms.map(function (r) { r.onleave = noop; return A.part(r.thread ? A.ThreadItem : A.RoomItem, r); })) }, $('sidebody'));
    add(A.ProfileBar, { you: me, backend: 'Work' }, $('side'));
  }
  add(A.BackendRail, { active: 'work', onadd: noop, backends: [{ id: 'home', label: 'Home lab', unread: true }, { id: 'work', label: 'Work' }, { id: 'family', label: 'Family chat', mentions: 2, unread: true }] }, $('rail'));
  side('deploy');
  add(A.RoomHeader, { room: 'ops', name: 'Ops', thread: 'deploy', threadName: 'Deploy', topic: '7 replies', onroom: noop, onedit: noop }, $('head'));
  var tl = $('tl');
  add(A.ThreadSummary, { ondismiss: noop, children: A.html('<p>Worker <code>1.9.0</code> crash-looped on the new queue client. Resolved:</p><ul><li>Rolled back to <code>1.8.3</code></li><li>Re-ran migration 0042 once the lock cleared</li></ul>') }, $('head'));
  add(A.Message, { sender: alice, time: '14:02', text: 'Deploy is green, rolling to prod now.' }, tl);
  add(A.TimelineDivider, { kind: 'date', label: '7 replies', sticky: false }, tl);
  add(A.Message, { sender: bob, time: '14:04', text: 'Worker pods are restarting in a loop.' }, tl);
  add(A.Message, { sender: bob, time: '14:04', grouped: true, text: 'Crash is in the new queue client.', embeds: [{ kind: 'upload', url: '#', title: 'worker-crash.log', og: { description: 'text/plain · 42 KB' } }] }, tl);
  add(A.Message, { sender: dana, time: '14:20', text: 'Rolled back worker to 1.8.3.', reactions: [{ emoji: '🙏', count: 2, mine: true, who: 'Sam, Bob' }], replyTo: { messageId: '1724803100000', sender: bob, snippet: 'Worker pods are restarting in a loop.' } }, tl);
  add(A.Message, { system: true, time: '14:25', children: A.html('Thread renamed to <span class="ap-msg-text">“Deploy”</span>') }, tl);
  add(A.Message, { sender: me, time: '14:32', text: 'Re-running the migration now.', embeds: [{ kind: 'stream', format: 'terminal', url: '#', text: '$ ./migrate up 0042\nacquiring lock on accounts… ok\napplying 0042_orders_idx… ' }] }, tl);
  add(A.Composer, { room: 'Ops', thread: { thread: 'deploy', name: 'Deploy' }, canUpload: true }, $('foot'));
  setTimeout(function () { tl.scrollTop = tl.scrollHeight; }, 60);
</script>
</body>
</html>
