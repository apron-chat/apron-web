  add(A.EmbedHtml, { kind: 'html', html: '<table><tr><th>Service</th><th>Status</th><th>p99</th></tr><tr><td>api</td><td>healthy</td><td>182 ms</td></tr><tr><td>worker</td><td>draining</td><td>—</td></tr></table>' });
</script>
