<!-- @dsCard group="Actions" height=260 subtitle="Pause notifications: closed, and open with when each choice ends; the room header's actions as an icon button; a status picker, open on the current choice with a dot before each" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MenuButton</title></head>
<body>
<div class="ap-row" id="root" style="align-items:flex-start;gap:220px;flex-wrap:wrap;row-gap:200px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props) { var box = document.createElement('div'); root.appendChild(box); return A.render(C, box, props || {}); }
  var choices = [
    { value: '1h', label: 'For 1 hour', hint: 'until 15:42' },
    { value: '8h', label: 'For 8 hours', hint: 'until 22:42' },
    { value: 'tomorrow', label: 'Until tomorrow', hint: '9:00' },
    { value: 'resume', label: 'Until I resume' }
  ];
  add(A.MenuButton, { label: 'Pause…', choices: choices, onselect: function () {} });
  add(A.MenuButton, { label: 'Pause…', choices: choices, open: true, onselect: function () {} });
  // With `icon`: an icon button whose `label` is its name and tooltip, here the room header's actions menu.
  add(A.MenuButton, { label: 'Room actions', icon: A.html('<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>'),
    choices: [{ value: 'edit', label: 'Edit room' }, { value: 'leave', label: 'Leave room' }], open: true, onselect: function () {} });
  // As a picker: `selected` checks the current choice; `lead` draws a StatusDot before each label.
  var statuses = [
    { value: 'online', label: 'Online', hint: 'Automatic' },
    { value: 'dnd', label: 'Do not disturb', hint: 'Mutes notifications' },
    { value: 'invisible', label: 'Invisible', hint: 'Appear offline' },
    { value: 'none', label: 'None', hint: 'Show no status' }
  ];
  var picker = document.createElement('div'); root.appendChild(picker);
  A.render(A.MenuButton, picker, { label: 'Do not disturb', choices: statuses, selected: 'dnd', open: true, onselect: function () {},
    lead: A.partOf(A.StatusDot, function (value) { return { status: value === 'none' ? undefined : value, decorative: true }; }) });
</script>
</body>
</html>
