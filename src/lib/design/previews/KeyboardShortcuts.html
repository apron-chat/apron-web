<!-- @dsCard group="Layout" height=640 subtitle="The keyboard shortcuts, opened with ?: titled groups in as many columns as fit, each shortcut what it does (and where, for one or the whole group) beside its keys" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>KeyboardShortcuts</title></head>
<body>
<div id="root"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  A.render(A.KeyboardShortcuts, root, {
    open: true,
    subtitle: 'Press ? to show these again.',
    groups: [
      { title: 'General', shortcuts: [
        { label: 'Show shortcuts', keys: [['?'], ['⌘', '/']] },
        { label: 'Search messages', keys: [['⌘', 'F']] }
      ] },
      { title: 'Rooms', shortcuts: [
        { label: 'Previous or next', keys: [['⌥', '↑'], ['⌥', '↓']] },
        { label: 'Move up or down', where: 'In the list', keys: [['⌥', '↑'], ['⌥', '↓']] }
      ] },
      { title: 'Composer', shortcuts: [
        { label: 'New line', keys: [['⇧', 'Enter']] },
        { label: 'Go to messages', where: 'When empty', keys: [['↑']] }
      ] },
      { title: 'Messages', where: 'On a message', shortcuts: [
        { label: 'Previous or next', keys: [['↑'], ['↓']] },
        { label: 'Reply', keys: [['r']] },
        { label: 'Edit', where: 'Yours only', keys: [['e']] },
        { label: 'Select to move', keys: [['x']] }
      ] }
    ]
  });
</script>
</body>
</html>
