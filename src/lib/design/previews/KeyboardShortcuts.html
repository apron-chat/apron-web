<!-- @dsCard group="Layout" height=640 subtitle="The keyboard shortcuts, opened with ?: titled groups in as many columns as fit, each shortcut what it does (and where) beside its keys" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>KeyboardShortcuts</title></head>
<body>
<div id="root"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  A.render(A.KeyboardShortcuts, root, {
    open: true,
    subtitle: 'Press ? to show these again.',
    groups: [
      { title: 'General', shortcuts: [
        { label: 'Show keyboard shortcuts', keys: [['?'], ['⌘', '/']] },
        { label: 'Search local history', keys: [['⌘', 'F']] }
      ] },
      { title: 'Composer', shortcuts: [
        { label: 'New line', keys: [['⇧', 'Enter']] },
        { label: 'Cancel the reply', where: 'While replying', keys: [['Esc']] }
      ] },
      { title: 'Messages', shortcuts: [
        { label: 'Select it, to move it', where: 'On a message', keys: [['x']] },
        { label: 'Go to the messages', where: 'In an empty composer, or with nothing focused', keys: [['↑']] },
        { label: 'Previous or next message', where: 'On a message', keys: [['↑'], ['↓']] },
        { label: 'Reply', where: 'On a message', keys: [['r']] }
      ] },
      { title: 'Rooms', shortcuts: [
        { label: 'Move a room up or down', where: 'On a room in the list', keys: [['⌥', '↑'], ['⌥', '↓']] }
      ] }
    ]
  });
</script>
</body>
</html>
