<!-- @dsCard group="Timeline" height=150 subtitle="Date (while scrolling), new, gap" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TimelineDivider</title></head>
<body>
<div id="root" style="padding-bottom:12px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  add(A.TimelineDivider, { kind: 'date', label: 'Today', scrolling: true });
  add(A.TimelineDivider, { kind: 'new' });
  add(A.TimelineDivider, { kind: 'gap' });
</script>
</body>
</html>
