<!-- @dsCard group="Input" height=500 subtitle="ThreadEditor for selected messages in a private room: says what moves, and that the thread is private like its room" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ThreadEditor, moving a selection</title></head>
<body>
<div id="root"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  A.render(A.ThreadEditor, root, {
    open: true,
    mode: 'start',
    subtitle: 'In Hiring',
    private: true,
    moving: 3,
    name: 'Offer for the platform role'
  });
</script>
</body>
</html>
