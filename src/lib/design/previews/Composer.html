<!doctype html>
<html>
<head><meta charset="utf-8"><title>Composer</title></head>
<body>
<div id="root" style="padding-top:8px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  add(A.Composer, { room: 'Ops', canUpload: true });
  add(A.Composer, { room: 'Ops', thread: { thread: 'deploy', name: 'Deploy' }, canUpload: true });
  add(A.Composer, { room: 'Ops', canUpload: true, recording: true, recordingTime: '0:12' });
  add(A.Composer, { room: 'Ops', canUpload: true, canCommand: true, value: '/kick @guest_1234 spamming' });
</script>
</body>
</html>
