<!doctype html>
<html>
<head><meta charset="utf-8"><title>RoleBadges</title></head>
<body>
<div id="root" style="padding: 16px; display: flex; flex-direction: column; gap: 12px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  add(A.RoleBadges, { roles: ['admin'] });
  add(A.RoleBadges, { roles: ['bot'] });
  add(A.RoleBadges, { roles: ['moderator', 'trusted'] });
</script>
</body>
</html>
