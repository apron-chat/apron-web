<!doctype html>
<html>
<head><meta charset="utf-8"><title>AddedBanner</title></head>
<body>
<div id="root" class="ap-stack" style="padding:0"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  var noop = function () {};
  A.render(A.AddedBanner, root, { onmute: noop, onleave: noop, ondismiss: noop });
  A.render(A.AddedBanner, root, { muted: true, onunmute: noop, onleave: noop, ondismiss: noop });
  A.render(A.AddedBanner, root, { onmute: noop, onleave: noop, ondismiss: noop, error: 'Too Many Requests' });
</script>
</body>
</html>
