<!-- @dsCard group="Identity" height=900 subtitle="Handle, avatar and bio, and a bio over its limit; the Sign-in group, which the client fills (adding a passkey, at each step); an upload in flight and one that failed; a declined handle, and one worded with the server's reason" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProfileEditor</title></head>
<body>
<div id="root" style="display:grid;grid-template-columns:repeat(2,232px);gap:16px;padding:16px;align-items:start"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  // The Sign-in group is the client's (`signin`): here, a session signed in with a token adding a passkey, at each step.
  function passkey(hint, tone) {
    return A.html('<span class="ap-profedit-row"><button class="ap-btn ap-btn-quiet ap-btn-sm" type="button">Add passkey</button><span class="ap-profedit-hint' + (tone ? ' ap-tone-' + tone : '') + '">' + hint + '</span></span>');
  }
  var waiting = A.html('<span class="ap-profedit-hint" role="status"><span class="ap-typing-dots" aria-hidden="true"><i></i><i></i><i></i></span> Confirm on your device…</span>');
  var saved = A.html('<span class="ap-profedit-hint ap-tone-ok" role="status">Passkey saved · this backend will ask your device next time</span>');
  add(A.ProfileEditor, { userId: 'alice', name: 'Alice Chen', canUpload: true, maxBio: 250, bio: 'Design systems, mostly. Ask me about color tokens.', signin: passkey('Signed in with a token') });
  add(A.ProfileEditor, { userId: 'alice', name: 'Alice Chen', maxBio: 250, bio: 'Design systems, mostly. '.repeat(11) });
  add(A.ProfileEditor, { userId: 'alice', name: 'alice', canUpload: true, status: 'altered', serverName: 'alice_2' });
  add(A.ProfileEditor, { userId: 'guest_7', name: 'Admin', status: 'declined' });
  add(A.ProfileEditor, { userId: 'guest_7', name: 'Alice', signin: waiting });
  add(A.ProfileEditor, { userId: 'alice', name: 'Alice Chen', canUpload: true, signin: saved });
  add(A.ProfileEditor, { userId: 'alice', name: 'Alice Chen', signin: passkey('The server didn’t accept it. Your token still works.', 'danger') });
  add(A.ProfileEditor, { userId: 'alice', name: 'Alice Chen', canUpload: true, avatarBusy: 'uploading' });
  add(A.ProfileEditor, { userId: 'alice', name: 'Alice Chen', canUpload: true, avatarError: 'The image is too large' });
  add(A.ProfileEditor, { userId: 'guest_7', name: 'root', status: 'declined', declinedNote: 'The server declined this handle (reserved). Sign in and it’s applied once you’re signed in.',
    signin: A.html('<span class="ap-profedit-row"><span class="ap-profedit-buttons"><button class="ap-btn ap-btn-sm" type="button">Sign in with a passkey</button><button class="ap-btn ap-btn-sm" type="button">Sign in with email</button></span><span class="ap-profedit-hint">Signed in as a guest</span></span><span class="ap-profedit-add" role="group" aria-label="Add email"><input class="ap-field" type="email" aria-label="Email address to add" placeholder="you@example.com"><button class="ap-btn ap-btn-sm" type="button">Send code</button><button class="ap-link" type="button">Cancel</button></span>') });
</script>
</body>
</html>
