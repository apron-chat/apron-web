<!doctype html>
<html>
<head><meta charset="utf-8"><title>EmbedTerminal</title></head>
<body>
<div id="root" class="ap-stack"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  // The app draws the screen with xterm.js through `attach`; without it, the text shows as it is.
  add(A.EmbedTerminal, { kind: 'terminal', title: 'make deploy', url: '#', text: '$ make deploy\nbuilding api… ok\nrunning migrations 0041..0042… ok\npushing image registry/api:4f2c… ' });
  add(A.EmbedTerminal, { kind: 'terminal', title: 'npm test', done: true, text: 'tests: 812 passed, 0 failed\ndone in 3m12s' });
</script>
</body>
</html>
