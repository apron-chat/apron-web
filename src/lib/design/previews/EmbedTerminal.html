<!-- @dsCard group="Embeds" height=420 subtitle="Live terminal, finished; Copy copies its text, Open shows the stream in a new tab, Expand full screen (a TerminalViewer)" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>EmbedTerminal</title></head>
<body>
<div id="root" class="ap-stack"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  // The app draws the screen with xterm.js through `attach`; without it, the text shows as it is.
  // `onexpand` shows Expand in the header (and a tap on the screen, on a touch screen), to open it full screen;
  // `oncopy`, Copy, to copy the screen's text (it says Copied when this returns true); `page`, a link to the stream
  // on a page of its own (terminal.apron.chat), in a new tab.
  var copy = function () { return true; };
  var expand = function () {};
  add(A.EmbedTerminal, { kind: 'terminal', title: 'make deploy', url: '#', text: '$ make deploy\nbuilding api… ok\nrunning migrations 0041..0042… ok\npushing image registry/api:4f2c… ', page: 'https://terminal.apron.chat/', oncopy: copy, onexpand: expand });
  add(A.EmbedTerminal, { kind: 'terminal', title: 'npm test', done: true, text: 'tests: 812 passed, 0 failed\ndone in 3m12s', oncopy: copy, onexpand: expand });
</script>
</body>
</html>
