<!doctype html>
<html>
<head><meta charset="utf-8"><title>DropZone</title></head>
<body>
<div id="root" style="position:relative;height:180px;margin:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg-100)"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  A.render(A.Message, root, { sender: { user_id: 'alice', name: 'Alice Chen' }, time: '14:02', text: 'Can you send the crash log?' });
  A.render(A.DropZone, root);
</script>
</body>
</html>
