<!-- @dsCard group="Feedback" height=380 subtitle="A request the server refused for a while: history, sending, a wait of hours, and a wait on anything else, each counting down" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>RateLimitNotice</title></head>
<body>
<div id="root" class="ap-stack"></div>
<script>
  var A = window.Apron, root = document.getElementById('root'), now = Date.now();
  function add(C, props) { var box = document.createElement('div'); root.appendChild(box); return A.render(C, box, props || {}); }
  // Shown in the timeline, where the messages will appear; it loads again by itself at zero.
  add(A.RateLimitNotice, { scope: 'history', since: now - 3000, until: now + 17000 });
  // Above the composer, whose Send counts down with it; the draft stays.
  add(A.RateLimitNotice, { scope: 'message', since: now - 2000, until: now + 28000 });
  add(A.Composer, { room: 'General', value: 'Sounds good, shipping it', waitUntil: now + 28000 });
  // An hour or more: a clock, in minutes, put away with its ×.
  add(A.RateLimitNotice, { scope: 'message', since: now - 60000, until: now + (3 * 60 + 12) * 60000, ondismiss: function () {} });
  // A wait on anything else: the server's words, made a sentence.
  add(A.RateLimitNotice, { message: 'Too Many Requests', since: now, until: now + 20000 });
  add(A.RoomHeader, { room: 'general', name: 'General', thread: 't1', threadName: 'Launch checklist', wait: now + 18000 });
</script>
</body>
</html>
