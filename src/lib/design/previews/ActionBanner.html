<!-- @dsCard group="Feedback" height=170 subtitle="A new version: Later and Reload, then with the line saying reloading clears an unsent message" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ActionBanner</title></head>
<body>
<div class="ap-stack" id="root" style="max-width:480px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props) { var box = document.createElement('div'); root.appendChild(box); return A.render(C, box, props || {}); }
  var reload = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>';
  var buttons = '<span style="display:flex;gap:4px"><button class="ap-btn ap-btn-ghost ap-btn-sm" type="button">Later</button><button class="ap-btn ap-btn-primary ap-btn-sm" type="button">Reload</button></span>';
  add(A.ActionBanner, { title: 'Apron has been updated', icon: A.html(reload), action: A.html(buttons) });
  add(A.ActionBanner, { title: 'Apron has been updated', detail: 'Reloading clears your unsent message.', icon: A.html(reload), action: A.html(buttons) });
</script>
</body>
</html>
