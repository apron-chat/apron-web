<!-- @dsCard group="Timeline" height=560 subtitle="Links to a message, room or thread as cards under the text, in a link preview's shape, where this client knows more of them than where they are" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>LinkCard</title></head>
<body>
<div id="root" style="padding: 12px 0"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var bob = { user_id: 'bob', name: 'Bob' }, grace = { user_id: 'grace', name: 'Grace Hopper' };
  var link = function (keys, server) { return 'https://link.apron.chat/#server=' + (server || 'wss://server.apron.chat/') + '&' + keys; };
  // An Apron link written as its URL, as the page draws it in a body: a chip that says what it is (`directory.resolveLink`).
  var chip = function (keys, kind, label, detail, server) {
    var classes = kind === 'elsewhere' ? 'ap-linkchip ap-linkchip-elsewhere' : 'ap-mention ap-mention-room ap-linkchip ap-linkchip-' + kind;
    return '<a class="' + classes + '" href="' + link(keys, server) + '">' + label + (detail ? '<span class="ap-linkchip-detail">' + detail + '</span>' : '') + '</a>';
  };
  var at = Date.parse('2026-10-24T14:05:00');
  // A Message's `view.linkCards`: a loaded message's card. A link to one not loaded here, or on another server, is its chip alone.
  add(A.Message, { view: { sender: bob, time: '14:30', body: { html: 'Same as ' + chip('room=general&message=1', 'message', 'Message', ' in #general') + ', not ' + chip('room=general&message=2', 'message', 'Message', ' in #general') + '.' }, linkCards: [
    { kind: 'message', href: link('room=general&message=1'), server: 'server.apron.chat', in: { id: 'general', title: 'general' }, sender: { name: 'Ada Lovelace', hue: 200 }, timestamp: at, time: 'Yesterday 2:05 PM', snippet: ['Deploy is green, rolling to prod now.\nAnyone object if I skip the canary wait?'] }
  ] } });
  // Rooms and threads, joined or listed, with their size and description.
  add(A.Message, { view: { sender: grace, time: '14:31', body: { html: 'Moving this to ' + chip('room=ops', 'room', 'ops') + ', notes in ' + chip('room=t-123', 'thread', 'Deploy checklist', ' in #general') + ', and ' + chip('room=lobby&message=4', 'elsewhere', 'chat.example', ' · Message', 'wss://chat.example/') }, linkCards: [
    { kind: 'room', href: link('room=ops'), server: 'server.apron.chat', room: { id: 'ops', title: 'ops' }, members: 42, private: true, description: 'Deploys, incidents and on-call. Page the on-call before touching prod.' },
    { kind: 'thread', href: link('room=t-123'), server: 'server.apron.chat', in: { id: 'general', title: 'general' }, room: { id: 't-123', title: 'Deploy checklist', thread: true }, members: 3 }
  ] } });
  // Beside a link preview (EmbedCard), whose shape the cards share.
  add(A.Message, { view: { sender: bob, time: '14:32', body: { html: 'And the PR:' }, embeds: [
    { key: 'pr', embed: { kind: 'link', url: 'https://github.com/apron-chat/apron-web/pull/118', og: { site_name: 'GitHub · apron-chat/apron-web', title: 'Show links to this server as cards', description: 'Pull request #118 · Open by bob' } } }
  ] } });
</script>
</body>
</html>
