<!-- @dsCard group="Layout" height=640 width=1280 page subtitle="Room view: threads show as summary rows; the member list in a column of its own; each side panel with its toggle in the corner and its border to drag" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>App shell</title><style>html,body{height:100%}</style></head>
<body>
<div id="root" style="height:640px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var alice = { user_id: 'alice', name: 'Alice Chen' }, bob = { user_id: 'bob', name: 'Bob' }, dana = { user_id: 'dana', name: 'Dana' }, me = { user_id: 'sam', name: 'Sam' };
  var noop = function () {}, $ = function (id) { return document.getElementById(id); };
  // The shell: the rooms list and the main pane are markup the parts below are mounted into.
  A.render(A.AppShell, root, {
    rail: A.html('<span id="rail" style="display:contents"></span>'),
    sideToggle: A.part(A.PanelToggle, { side: 'left', panel: 'rooms', open: true }),
    side: A.html('<aside class="ap-shell-side" id="side"><div class="ap-shell-sidehead">Work</div><div class="ap-shell-sidebody" id="sidebody"></div></aside>'),
    sideHandle: A.part(A.PanelHandle, { side: 'left' }),
    main: A.html('<span id="head" style="display:contents"></span><div class="ap-timeline" id="tl"></div><span id="foot" style="display:contents"></span>'),
    members: A.part(A.MemberList, { room: 'Ops', count: 5, sections: [
      { key: 'online', label: 'Online', people: [{ user_id: 'alice', name: 'Alice Chen', status: 'online', roles: ['admin'] }, { user_id: 'bob', name: 'Bob', status: 'idle' }, { user_id: 'sam', name: 'Sam', status: 'online', you: true }] },
      { key: 'offline', label: 'Offline', people: [{ user_id: 'dana', name: 'Dana', status: 'offline' }, { user_id: 'deploybot', name: 'Deploy bot', status: 'offline', roles: ['bot'] }] }] }),
    membersOpen: true, membersWide: true,
    membersToggle: A.part(A.PanelToggle, { side: 'right', panel: 'member list', open: true }),
    membersHandle: A.part(A.PanelHandle, { side: 'right', name: 'member list' })
  });
  // Hover a message for its toolbar, from what the viewer may do.
  var caps = { reply: true, edit: false, startThread: true, select: false, removeReply: false, react: true, link: true };
  var mine = { reply: true, edit: true, startThread: false, select: true, removeReply: false, react: true, link: true };
  function msg(view, at) { view.caps = view.caps || caps; return add(A.Message, { view: view, on: {} }, at); }
  function side(activeThread) {
    var rooms = [
      { room: 'general', name: 'General' }, { room: 'ops', name: 'Ops', active: !activeThread },
      { thread: 'deploy', name: 'Deploy', active: activeThread === 'deploy', unread: activeThread ? 0 : 2, summary: 'Worker 1.9.0 crash-looped; rolled back to 1.8.3', latest: { sender: 'Sam', text: 'Re-running the migration now.' } },
      { thread: 'mig-0042', name: 'Migration 0042', summary: 'Lock held on accounts table by a stale worker', latest: { sender: 'Dana', text: 'Lock cleared' } }, { thread: 'oncall', name: 'On-call rotation' },
      { room: 'design', name: 'Design', unread: 4, mentions: activeThread ? 0 : 1 }, { room: 'random', name: 'Random' }];
    add(A.SidebarSection, { title: 'Rooms', children: A.parts.apply(null, rooms.map(function (r) { r.onleave = noop; return A.part(r.thread ? A.ThreadItem : A.RoomItem, r); })) }, $('sidebody'));
    add(A.ProfileBar, { you: me, backend: 'Work' }, $('side'));
  }
  add(A.BackendRail, { active: 'work', onadd: noop, backends: [{ id: 'home', label: 'Home lab', unread: true }, { id: 'work', label: 'Work' }, { id: 'family', label: 'Family chat', mentions: 2, unread: true }] }, $('rail'));
  side(null);
  add(A.RoomHeader, { room: 'ops', name: 'Ops', topic: 'Deploys and incidents', onedit: noop }, $('head'));
  var tl = $('tl');
  add(A.TimelineDivider, { kind: 'date', label: 'Today' }, tl);
  msg({ sender: alice, time: '14:02', body: { html: 'Deploy is green, rolling to prod now.' } }, tl);
  add(A.ThreadMarker, { row: true, thread: 'deploy', name: 'Deploy', unread: 2, lastReply: '12m', participants: [bob, dana, me], summary: 'Worker 1.9.0 crash-looped; rolled back to 1.8.3', latest: { sender: me, text: 'Re-running the migration now.' } }, tl);
  msg({ sender: bob, time: '14:05', mention: true, body: { markdown: true, html: '<p><span class="ap-mention ap-mention-me" data-user-id="sam" title="@sam">@Sam</span> migration 0042 is holding a lock, can you look?</p>' } }, tl);
  add(A.ThreadMarker, { row: true, thread: 'mig-0042', name: 'Migration 0042', lastReply: '3h', participants: [dana, me], summary: 'Lock held on accounts table by a stale worker' }, tl);
  msg({ sender: dana, time: '14:21', body: { html: 'Moved the worker chatter into Deploy.' } }, tl);
  add(A.ThreadMarker, { thread: 'deploy', name: 'Deploy', moved: true }, tl);
  add(A.TimelineDivider, { kind: 'new' }, tl);
  msg({ sender: bob, time: '14:31', body: { html: 'Retro at 16:00, same link as last week.' }, reply: { id: '1724803000000', name: dana.name, snippet: ['Should we do the retro today or wait for the write-up?'] } }, tl);
  add(A.TypingIndicator, { names: ['Dana'] }, $('foot'));
  add(A.Composer, { room: 'Ops', canUpload: true }, $('foot'));
</script>
</body>
</html>
