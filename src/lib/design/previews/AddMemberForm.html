<!-- @dsCard group="Navigation" height=200 subtitle="Adding a member: their @user_id, with suggestions; Add waits for one, and while an add is under way" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>AddMemberForm</title></head>
<body>
<div id="root" class="ap-stack" style="width:260px;padding:16px;gap:12px;box-sizing:content-box"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var noop = function () {};
  add(A.AddMemberForm, { value: '@lee', candidates: [{ user_id: 'lee', name: 'Lee' }, { user_id: 'grace', name: 'Grace' }], onadd: noop, ondismiss: noop });
  add(A.AddMemberForm, { value: '@grace', busy: true });
</script>
</body>
</html>
