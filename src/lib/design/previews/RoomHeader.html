<!-- @dsCard group="Navigation" height=360 subtitle="Room with its member list's toggle and ⋯ actions (Mute, Edit, Leave), private room with its description put away, a conversation with one person (their face, and who can see it), open thread with its replies, muted (a bell-off button that unmutes, left of its ⋯ menu, which offers Unmute too), a thread read without joining; on phones a ‹ back to the rooms list, a tag with what's new elsewhere, and who's typing; while other rooms catch up, a thin line running along its foot" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>RoomHeader</title></head>
<body>
<div id="root" class="ap-stack" style="padding:0;gap:12px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var noop = function () {};
  var muteChoices = function () { return [{ value: '1h', label: 'For 1 hour', hint: 'until 15:42' }, { value: '2h', label: 'For 2 hours', hint: 'until 16:42' }, { value: '8h', label: 'For 8 hours', hint: 'until 22:42' }, { value: 'forever', label: 'Until I unmute' }]; };
  add(A.RoomHeader, { room: 'ops', name: 'Ops', topic: 'Deploys and incidents. On-call: see pinned runbook.', onback: noop, onmemberlist: noop, muteChoices: muteChoices, onmute: noop, onedit: noop, onleave: noop });
  add(A.RoomHeader, { room: '1724803950000', name: 'Hiring', topic: 'Members only', private: true, onback: noop, unreadElsewhere: 4, onmemberlist: noop, memberListOpen: true, ondescription: noop, onedit: noop });
  add(A.RoomHeader, { room: 'p1', name: 'Bob', faces: [{ user_id: 'bob', name: 'Bob', hue: 200, status: 'online' }], topic: 'Online · only you and Bob can see this room', private: true, onmemberlist: noop, onleave: noop });
  add(A.RoomHeader, { room: 'ops', name: 'Ops', thread: 'mig-0042', threadName: 'Migration 0042', replies: { count: 12, more: true }, onback: noop, unreadElsewhere: 3, mentionsElsewhere: 1, onroom: noop, muted: 'until 15:42', onunmute: noop, onedit: noop, onleave: noop });
  add(A.RoomHeader, { room: 'ops', name: 'Ops', thread: 'deploy', threadName: 'Deploy', typing: ['Alice'], replies: { count: 1 }, onback: noop, onroom: noop, canJoin: true, onjoin: noop, note: 'History unavailable' });
  add(A.RoomHeader, { room: 'general', name: 'General', topic: 'Say hello', onback: noop, onmemberlist: noop, updating: true });
</script>
</body>
</html>
