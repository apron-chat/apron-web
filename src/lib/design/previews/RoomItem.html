<!doctype html>
<html>
<head><meta charset="utf-8"><title>RoomItem</title></head>
<body>
<div id="root" class="ap-stack" style="background:var(--bg-000);gap:2px;width:248px;box-sizing:border-box;padding:8px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var leave = function () {};
  add(A.RoomItem, { room: 'general', name: 'General', topic: 'Anything goes', onleave: leave });
  add(A.RoomItem, { room: 'ops', name: 'Ops', active: true, onnewthread: leave });
  add(A.RoomItem, { room: 'design', name: 'Design', unread: 12, mentions: 2, onleave: leave });
  add(A.RoomItem, { room: '1724803950000', name: 'Hiring', topic: 'Members only', private: true, onleave: leave });
  add(A.RoomItem, { room: 'alerts', name: 'Alerts', muted: true, unread: 8, mentions: 1, onleave: leave });
  add(A.RoomItem, { room: 'random', name: 'Random', unread: 3, loading: true });
  add(A.RoomItem, { room: 'books', name: 'Book club', topic: '12 members · Join' });
  add(A.RoomItem, { room: 'p1', name: 'Bob', faces: [{ user_id: 'bob', name: 'Bob', hue: 200, status: 'online' }], mentions: 1, unread: 1 });
  add(A.RoomItem, { room: 'p2', name: 'Dev, Mira', faces: [{ user_id: 'dev', name: 'Dev', hue: 140 }, { user_id: 'mira', name: 'Mira', hue: 80 }] });
</script>
</body>
</html>
