<!doctype html>
<html>
<head><meta charset="utf-8"><title>RoomItem</title></head>
<body>
<div id="root" class="ap-stack" style="background:var(--bg-000);gap:2px;width:248px;box-sizing:border-box;padding:8px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var leave = function () {};
  add(A.RoomItem, { room: 'general', name: 'General', topic: 'Anything goes', onleave: leave });
  add(A.RoomItem, { room: 'ops', name: 'Ops', topic: 'Deploys and incidents', unread: 12, mentions: 2, onleave: leave });
  add(A.RoomItem, { room: 'deploy', name: 'Deploy', nested: true, unread: 2, onleave: leave });
  add(A.RoomItem, { room: 'mig-0042', name: 'Migration 0042', nested: true, active: true, onleave: leave });
  add(A.RoomItem, { room: 'oncall', name: 'On-call rotation', nested: true, mentions: 1, onleave: leave });
  add(A.RoomItem, { room: 'random', name: 'Random', unread: 3, onleave: leave });
</script>
</body>
</html>
