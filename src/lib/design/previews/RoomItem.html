<!doctype html>
<html>
<head><meta charset="utf-8"><title>RoomItem</title></head>
<body>
<div id="root" class="ap-stack" style="background:var(--bg-000);gap:2px;width:248px;box-sizing:border-box;padding:8px"></div>
<script>

  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var leave = function () {};
  add(A.RoomItem, { room: 'general', name: 'General', topic: 'Anything goes', onleave: leave });
  add(A.RoomItem, { room: 'ops', name: 'Ops', topic: 'Deploys and incidents', unread: 12, mentions: 2, onleave: leave });

  add(A.RoomItem, { room: 'mig-0042', name: 'Migration 0042', nested: true, active: true, latest: { sender: 'Sam', text: 'Lock cleared, applying 0042' }, onleave: leave });
  add(A.RoomItem, { room: 'oncall', name: 'On-call rotation', nested: true, mentions: 1, summary: 'Who carries the pager, week by week', onleave: leave });
  add(A.RoomItem, { room: 'cert', name: 'Expired cert', nested: true, latest: { sender: 'Linus', text: 'Renewed it, CI is green again' }, onleave: leave });
  add(A.RoomItem, { room: 'offsite', name: 'Offsite planning', nested: true, summary: 'Dates, venue, and who books travel', ago: '2h', onjoin: leave });
  add(A.RoomItem, { room: 'logo', name: 'Logo feedback', nested: true, private: true, ago: 'Tue', onjoin: leave });
  add(A.RoomItem, { room: 'random', name: 'Random', unread: 3, onleave: leave });
</script>
</body>
</html>
