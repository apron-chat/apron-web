<!-- @dsCard group="Timeline" height=250 subtitle="Floating button, the mention bar, and both docked in a pane above the composer" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>JumpBar</title></head>
<body>
<div id="root" class="ap-stack" style="padding:24px 0 16px"><div id="fabs" style="display:flex;gap:24px;align-items:center;justify-content:flex-end;padding:8px 16px"></div></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var fabs = document.getElementById('fabs');
  add(A.JumpBar, {}, fabs); add(A.JumpBar, { count: 3 }, fabs); add(A.JumpBar, { count: 128 }, fabs);
  add(A.JumpBar, { count: 12, mentions: 1 });
  // Docked: the button floats over the timeline's bottom-right corner, taking no space; the bar sits above the composer.
  var docks = document.createElement('div'); docks.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px'; root.appendChild(docks);
  function pane() { var box = document.createElement('div'); box.style.cssText = 'display:flex;flex-direction:column;justify-content:flex-end;height:72px;border:1px solid var(--line);border-radius:10px;background:var(--bg-100)'; docks.appendChild(box); return box; }
  add(A.JumpBar, { docked: true, count: 4 }, pane());
  add(A.JumpBar, { docked: true, count: 2, mentions: 2 }, pane());
</script>
</body>
</html>
