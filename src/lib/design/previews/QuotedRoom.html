<!-- @dsCard group="Timeline" height=260 subtitle="A room or thread a link points to, under the text: a private room with a description; a thread in its room" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>QuotedRoom</title></head>
<body>
<div id="root" style="padding: 12px 0"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var grace = { user_id: 'grace', name: 'Grace Hopper' };
  var link = function (room) { return 'https://link.apron.chat/#server=wss://chat.example/ws&room=' + room; };
  var chip = function (room, label) { return '<a class="ap-mention ap-linkchip ap-linkchip-room ap-mention-room ap-mention-hash-room" href="' + link(room) + '">' + label + '</a>'; };
  // A Message's `view.quotes` with `kind: 'room'`: its links to rooms and threads, drawn in its text as chips.
  add(A.Message, { view: { sender: grace, time: '14:31', body: { html: 'Moving this to ' + chip('ops', '#ops') + ', notes in ' + chip('t-123', '#Deploy checklist') }, quotes: [
    { kind: 'room', href: link('ops'), room: { id: 'ops', title: 'ops' }, description: 'Deploys, incidents and on-call. Page the on-call before touching prod.', members: 42, private: true },
    { kind: 'room', href: link('t-123'), room: { id: 't-123', title: 'Deploy checklist', thread: true }, parent: { id: 'general', title: 'general' }, members: 3, description: 'What to check before a deploy: migrations, flags, and who is on call.' }
  ] } });
</script>
</body>
</html>
