<!-- @dsCard group="Timeline" height=640 subtitle="Select mode with the bar; in a thread, its menu open with Move to room; a move the server partly refused" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SelectionBar</title></head>
<body>
<div id="root" style="padding-top:8px"></div>
<script>
  var A = window.Apron, root = document.getElementById('root');
  function add(C, props, at) { return A.render(C, at || root, props || {}); }
  var alice = { user_id: 'alice', name: 'Alice Chen' }, bob = { user_id: 'bob', name: 'Bob' }, dana = { user_id: 'dana', name: 'Dana' };
  var none = function () {};
  add(A.Message, { sender: alice, time: '14:02', text: 'Deploy is green, rolling to prod now.', selectMode: true });
  add(A.Message, { sender: bob, time: '14:04', text: 'Worker pods are restarting in a loop.', selectMode: true, selected: true });
  add(A.Message, { sender: bob, time: '14:04', grouped: true, text: 'Crash is in the new queue client.', selectMode: true, selected: true });
  add(A.Message, { sender: dana, time: '14:20', text: 'Rolled back worker to 1.8.3.', selectMode: true, selected: true });
  add(A.Message, { sender: alice, time: '14:31', text: 'Retro at 16:00, same link as last week.', selectMode: true });
  add(A.SelectionBar, { count: 3, threads: [{ thread: 'deploy', name: 'Deploy' }, { thread: 'mig-0042', name: 'Migration 0042' }], onselectrange: none, onnewthread: none });
  add(A.SelectionBar, { count: 3, status: 'saving' });
  // In a thread: the menu offers the room first. Without onnewthread (no capability `rooms`) there is no New thread.
  var spacer = document.createElement('div'); spacer.style.height = '96px'; root.appendChild(spacer);
  add(A.SelectionBar, { count: 2, room: 'ops', threads: [{ thread: 'mig-0042', name: 'Migration 0042' }], open: true, onselectrange: none });
  add(A.SelectionBar, { count: 2, denied: { failed: 2, total: 5 }, threads: [{ thread: 'deploy', name: 'Deploy' }], onnewthread: none });
  var narrow = document.createElement('div'); narrow.style.width = '470px'; root.appendChild(narrow);
  add(A.SelectionBar, { count: 3, threads: [{ thread: 'deploy', name: 'Deploy' }], onselectrange: none, onnewthread: none }, narrow);
</script>
</body>
</html>
