<!-- @dsCard group="Layout" height=360 subtitle="A short question: a title and close button, text in the body, Cancel and the primary action in the footer. Forms for rooms and threads are RoomForm." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div id="root"></div>
<style>.ap-dialog-body p { color: var(--ink-muted); }</style>
<script>
  var A = window.Apron, root = document.getElementById('root');
  A.render(A.Dialog, root, {
    open: true,
    title: 'Sign in to chat.example.com with this email link?',
    closeLabel: 'Cancel',
    onsubmit: function (event) { event.preventDefault(); },
    children: A.html(
      '<p style="margin:0">You’re signed in here as Sam. Continuing signs you out of that account and in to the one the link is for.</p>' +
      '<p style="margin:0">Only continue if you just asked for this email. A link someone sent you can sign you in to their account.</p>'
    ),
    footer: A.html('<span style="display:flex;gap:8px"><button class="ap-btn ap-btn-ghost ap-btn-sm" type="button">Cancel</button><button class="ap-btn ap-btn-primary ap-btn-sm" type="submit">Sign in</button></span>')
  });
</script>
</body>
</html>
