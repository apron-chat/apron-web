<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#15151f" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f8f6f3" media="(prefers-color-scheme: light)" />
		<script>
			// The saved mode and theme's tokens, before the first paint; appearance.svelte.ts
			// applies (and validates) them again once the app loads. Keep the two in step.
			try {
				const saved = JSON.parse(localStorage.getItem('apron.appearance') || '{}');
				const root = document.documentElement;
				if (saved.mode === 'light' || saved.mode === 'dark') root.dataset.theme = saved.mode;
				for (const [name, value] of Array.isArray(saved.vars) ? saved.vars : []) {
					if (typeof name === 'string' && /^--[A-Za-z0-9_-]+$/.test(name) && typeof value === 'string' && !/[\\{};!@]|\b(?:url|src|image|image-set|cross-fade|element)\s*\(/i.test(value)) root.style.setProperty(name, value);
				}
			} catch {}
		</script>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
