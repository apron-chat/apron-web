name: CI

on:
  # Branches with a pull request are covered by the pull_request run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The unit tests replay the protocol fixtures in protocol/.
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The design system bundle builds from src/lib/design.
      - run: npm run design:bundle

  # The perf budget: counts (layouts, style recalcs, DOM nodes, requests, bytes) per perf probe against
  # scripts/qa/perf-budget.json. Counts hold steady across runners where timings don't; see scripts/qa/README.md.
  perf-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: perf-budget-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: APRON_PREVIEW=1 npm run build
      - run: npm run qa -- budget --build build
